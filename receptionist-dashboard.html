    <button type="button" class="create-ticket-button" id="create-ticket-button">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="24"
         height="24"
         fill="currentColor"
         viewBox="0 0 24 24">
        <path d="M3 13h8v8h2v-8h8v-2h-8V3h-2v8H3z"></path>
    </svg>

    <span class="button-text">Create Ticket</span>
    </button>

    <main class="ticket-panel" id="ticket-panel" hidden>

    <h2 id="panel-title">Maintenance Records</h2>

    <table class="maintenance-table">
        <thead>
            <tr>
                <th>Ticket ID</th>
                <th>Room</th>
                <th>Subject</th>
                <th>Priority</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="ticket-list">
            <!-- Ticket rows will appear here -->
        </tbody>
    </table>

</main>



    <div id="ticket-form-container" hidden>
    <form id="ticket-form">
        <h2>Create Maintenance Ticket</h2>

        <label for="room-number">Room Number</label>
        <input type="text" id="room-number" required>

        <label for="problem">Problem Description</label>
        <textarea id="problem" required></textarea>

        <label for="priority">Priority</label>
        <select id="priority" required>
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>

        <button type="submit">Save Ticket</button>
        <button type="button" id="cancel-ticket-button">Cancel</button>
        <p id="ticket-form-message"></p>
    </form>
</div>
